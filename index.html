<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFC Survey Link Generator - Bannerghatta Road</title>

    <!-- Excel file parser -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 30px; color: #222; }
        .store-card { background: #f8f9fa; border-left: 5px solid #e4002b; padding: 15px 20px; margin-bottom: 25px; border-radius: 4px; }
        .store-card h2 { margin: 0 0 10px 0; color: #e4002b; }
        .store-card p { margin: 3px 0; }
        .upload-section { border: 2px dashed #bbb; padding: 25px; max-width: 500px; border-radius: 6px; background: #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; font-size: 13px; word-break: break-all; }
        th { background-color: #f4f4f4; }
        button { cursor: pointer; padding: 6px 12px; background: #e4002b; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background: #b80022; }
    </style>
</head>
<body>

    <div class="store-card">
        <h2>KFC Bannerghatta Road</h2>
        <p><strong>Champ ID:</strong> 91KDIPL551-01</p>
        <p><strong>Store SAP Code:</strong> K243</p>
    </div>

    <div class="upload-section">
        <h3>Upload KFC Sales Excel File</h3>
        <input type="file" id="excelFile" accept=".xlsx, .xls" />
    </div>

    <table id="outputTable">
        <thead>
            <tr>
                <th>Customer No.</th>
                <th>Order ID (Receipt)</th>
                <th>Sales Type</th>
                <th>Date</th>
                <th>Time</th>
                <th>Phone (Sell-to Contact No.)</th>
                <th>Generated Survey Link</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <!-- Processed rows render here -->
        </tbody>
    </table>

    <script>
        const BASE_SURVEY_URL = "https://customer.kfc-listens.com/jfe/form/SV_8bHC0noyvM3jPWC";
        const CHAMP_ID = "91KDIPL551-01";

        // Precise Date Formatter (Prevents GMT/UTC time-shift errors)
        function formatExcelDate(val) {
            if (!val) return '2026-09-02';

            // Excel numeric serial (e.g. 46279)
            if (typeof val === 'number') {
                const dateObj = XLSX.SSF.parse_date_code(val);
                const year = dateObj.y;
                const month = String(dateObj.m).padStart(2, '0');
                const day = String(dateObj.d).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            // JavaScript Date Object
            if (val instanceof Date) {
                const year = val.getFullYear();
                const month = String(val.getMonth() + 1).padStart(2, '0');
                const day = String(val.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            const strVal = String(val).trim();

            // Handles standard DD/MM/YYYY or DD-MM-YYYY formats directly
            if (strVal.match(/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/)) {
                const parts = strVal.split(/[\/\-]/);
                let day = parts[0].padStart(2, '0');
                let month = parts[1].padStart(2, '0');
                let year = parts[2];
                if (year.length === 2) year = '20' + year;
                return `${year}-${month}-${day}`;
            }

            // Handles YYYY-MM-DD or string timestamps
            if (strVal.includes('T')) return strVal.split('T')[0];
            if (strVal.includes(' ')) return strVal.split(' ')[0];

            return strVal;
        }

        // Clean Time Formatter
        function formatExcelTime(val) {
            if (val === undefined || val === null || val === '') return '14:24:14';
            
            if (typeof val === 'number') {
                const totalSeconds = Math.round(val * 86400);
                const hours = String(Math.floor(totalSeconds / 3600) % 24).padStart(2, '0');
                const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
                const seconds = String(totalSeconds % 60).padStart(2, '0');
                return `${hours}:${minutes}:${seconds}`;
            }

            if (val instanceof Date) {
                const hours = String(val.getHours()).padStart(2, '0');
                const minutes = String(val.getMinutes()).padStart(2, '0');
                const seconds = String(val.getSeconds()).padStart(2, '0');
                return `${hours}:${minutes}:${seconds}`;
            }

            let strVal = String(val).trim();
            if (strVal.includes('T')) strVal = strVal.split('T')[1] || strVal;
            if (strVal.includes(' ')) {
                const parts = strVal.split(' ');
                strVal = parts.find(p => p.includes(':')) || strVal;
            }
            return strVal.split('.')[0];
        }

        function getOrderTypeId(salesTypeStr) {
            const cleanStr = String(salesTypeStr || '').trim().toLowerCase();
            if (cleanStr.includes('dine')) return "1";
            if (cleanStr.includes('take') || cleanStr.includes('carry')) return "2";
            if (cleanStr.includes('deliv')) return "3";
            if (cleanStr.includes('drive')) return "4";
            if (!isNaN(cleanStr) && cleanStr !== '') return cleanStr;
            return "1";
        }

        function getPhoneFromRow(row) {
            const possibleHeaders = [
                'Sell-to Contact No.', 'Sell-to Contact No', 'Sell to Contact No.', 'Sell to Contact No',
                'Phone', 'Phone Number', 'PhoneNo', 'Phone No', 'Mobile', 'Mobile Number', 'Customer Phone', 'PH'
            ];
            for (let header of possibleHeaders) {
                if (row[header] !== undefined && row[header] !== null && String(row[header]).trim() !== '') {
                    return String(row[header]).trim();
                }
            }
            return '';
        }

        function getCustomerNo(row) {
            const possibleHeaders = ['Customer No.', 'Customer No', 'CustomerNo', 'Customer_No', 'Cust No'];
            for (let header of possibleHeaders) {
                if (row[header] !== undefined && row[header] !== null && String(row[header]).trim() !== '') {
                    return String(row[header]).trim();
                }
            }
            return '';
        }

        document.getElementById('excelFile').addEventListener('change', handleFile, false);

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                // raw: true prevents auto timezone conversions on dates
                const workbook = XLSX.read(data, { type: 'array', raw: true });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet, { raw: true });

                generateLinks(rows);
            };
            reader.readAsArrayBuffer(file);
        }

        function generateLinks(data) {
            const tbody = document.querySelector('#outputTable tbody');
            tbody.innerHTML = '';

            data.forEach(row => {
                const customerNo = getCustomerNo(row);
                
                // Skip rows where Customer No. is missing
                if (!customerNo) return;

                const orderId = String(row['Order ID'] || row['Receipt No.'] || row['Receipt'] || row['Check No'] || '');
                const rawSalesType = String(row['Sales Type'] || row['Order Type'] || row['SalesType'] || 'Dine-In');
                const orderTypeId = getOrderTypeId(rawSalesType);

                const dateStr = formatExcelDate(row['Date'] || row['Order Date'] || row['Business Date'] || row['Posting Date']);
                const timeStr = formatExcelTime(row['Time'] || row['Order Time'] || row['Check Time']);
                const phoneStr = getPhoneFromRow(row);
                const surveyModel = String(row['Survey Model'] || '6.0');

                const dtmStr = `${dateStr}T${timeStr}.000Z`;
                const tmFormatted = `${timeStr}.000`;

                const payload = {
                    "S": CHAMP_ID,
                    "OI": orderId,
                    "D": dateStr,
                    "TM": tmFormatted,
                    "DTM": dtmStr,
                    "TI": "",
                    "OT": orderTypeId,
                    "SM": surveyModel,
                    "PH": phoneStr
                };

                const base64Encoded = btoa(JSON.stringify(payload));
                const finalSurveyUrl = `${BASE_SURVEY_URL}?Q_EED=${base64Encoded}`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${customerNo}</td>
                    <td>${orderId}</td>
                    <td>${rawSalesType} (OT: ${orderTypeId})</td>
                    <td>${dateStr}</td>
                    <td>${timeStr}</td>
                    <td>${phoneStr}</td>
                    <td><a href="${finalSurveyUrl}" target="_blank">Survey Link</a></td>
                    <td><button onclick="navigator.clipboard.writeText('${finalSurveyUrl}')">Copy Link</button></td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
